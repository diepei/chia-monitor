name: Release standalone agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            asset: chia-monitor-linux-x86_64
          - runner: ubuntu-24.04-arm
            asset: chia-monitor-linux-arm64
          - runner: macos-14
            asset: chia-monitor-macos-arm64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt pyinstaller==6.15.0
      - name: Build single executable
        run: >-
          pyinstaller --clean --onefile --name "${{ matrix.asset }}"
          --collect-all uvicorn --collect-all fastapi entrypoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: agent/dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum chia-monitor-* > SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
