name: Release standalone agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: windows-2022
            asset: chia-monitor-windows-x86_64.exe
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - run: pip install -r requirements.txt pyinstaller==6.15.0
      - name: Build single executable
        shell: pwsh
        run: pyinstaller --clean --onefile --name "${{ matrix.asset }}" --collect-all uvicorn --collect-all fastapi entrypoint.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: agent/dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksum
        working-directory: release
        shell: pwsh
        run: (Get-FileHash chia-monitor-windows-x86_64.exe -Algorithm SHA256).Hash.ToLower() + "  chia-monitor-windows-x86_64.exe" | Set-Content SHA256SUMS
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release/* --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag
          fi
